name: "Build Android APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.0.11902837"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: install cargo-license
        run: cargo install cargo-license

      - uses: pnpm/action-setup@v6

      - name: install frontend dependencies
        run: pnpm install

      - name: install problematic dependencies
        run: pnpm install --save-dev @tauri-apps/cli --workspace-root

      - name: generate THIRD_PARTY_LICENSES.md
        run: pnpm run make:licenses

      - name: Build Android Debug APK
        run: pnpm run tauri android build --apk --debug
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilepad-android-8.1-fixed-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
