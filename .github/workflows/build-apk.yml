name: "Build Android APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: pnpm/action-setup@v6

      - name: install frontend dependencies
        run: pnpm install

      - name: install problematic dependencies
        run: pnpm install --save-dev @tauri-apps/cli --workspace-root

      - name: Build Android Debug APK
        run: pnpm run tauri android build --apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilepad-android-8.1-fixed-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
